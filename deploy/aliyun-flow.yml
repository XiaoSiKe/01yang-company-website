name: 01yang-company-website-prod

sources:
  website:
    type: git
    name: 零一扬官网公共源码
    endpoint: https://github.com/XiaoSiKe/01yang-company-website.git
    branch: main
    branchesFilter: ^main$
    triggerEvents:
      - push

defaultWorkspace: website

# 私密变量通过控制台“变量和缓存 → 通用变量组”关联：
# 01yang-company-website-prod-secrets（OpenAPI ID 43787）。不要在YAML写入私钥。

stages:
  release_stage:
    name: 检查、构建与独立发布
    jobs:
      build_job:
        name: 云端构建与官网受限SSH发布
        runsOn:
          group: public/cn-hongkong
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: MEDIUM_2C4G
        timeoutMinutes: 20
        plugins:
          - name: 官网构建或发布失败通知
            plugin: EmailPlugin
            triggerState:
              - fail
            with:
              email: 1241798750@qq.com
        steps:
          build_step:
            name: 固定环境、检查与构建
            step: Command
            with:
              run: bash deploy/ci-build.sh
          publish_step:
            name: 校验后发布官网（不修改备案开放开关）
            step: Command
            with:
              run: bash deploy/ci-publish.sh
