# 只管理01yang官网，不修改25th默认入口或其它server块。
server {
    listen 80;
    server_name www.01yang.space 01yang.space;
    access_log /var/log/nginx/01yang-company-website.access.log;
    error_log /var/log/nginx/01yang-company-website.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/01yang-company-website/acme;
        try_files $uri =404;
    }
    location / { return 308 https://www.01yang.space$request_uri; }
}

server {
    listen 443 ssl;
    server_name 01yang.space;
    ssl_certificate /etc/letsencrypt-01yang/live/01yang-company-website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-01yang/live/01yang-company-website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/01yang-company-website.access.log;
    error_log /var/log/nginx/01yang-company-website.error.log;
    return 308 https://www.01yang.space$request_uri;
}

server {
    listen 443 ssl;
    server_name www.01yang.space;
    ssl_certificate /etc/letsencrypt-01yang/live/01yang-company-website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-01yang/live/01yang-company-website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/01yang-company-website/current;
    index index.html;
    access_log /var/log/nginx/01yang-company-website.access.log;
    error_log /var/log/nginx/01yang-company-website.error.log;

    set $company_access 0;
    if ($remote_addr = 127.0.0.1) { set $company_access 1; }
    # 仅管理员在备案验收完成后创建此开关，部署用户无权开启。
    if (-f /etc/01yang-company-website/public-enabled) { set $company_access 1; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\. { deny all; }
    location = /version.json {
        if ($company_access = 0) { return 503; }
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }
    location ^~ /_next/static/ {
        if ($company_access = 0) { return 503; }
        alias /var/www/01yang-company-website/shared/static/;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location / {
        if ($company_access = 0) { return 503; }
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
