# 解析/TLS准备期间使用：精确匹配官网域名，不占用默认站点。
server {
    listen 80;
    server_name www.01yang.space 01yang.space;
    root /var/www/01yang-company-website/current;
    index index.html;
    access_log /var/log/nginx/01yang-company-website.access.log;
    error_log /var/log/nginx/01yang-company-website.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/01yang-company-website/acme;
        try_files $uri =404;
    }
    location / {
        if ($remote_addr != 127.0.0.1) { return 503; }
        try_files $uri $uri/ =404;
    }
}
